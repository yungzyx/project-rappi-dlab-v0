[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rappi-ia"
version = "0.1.0"
description = "Conceptos, embeddings, búsqueda híbrida por vertical, agente Bigotes y analítica sobre el catálogo de Rappi Chile"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rappi-scraper",  # esquema y migraciones de la base (se instala desde ../rappi-scraper)
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "torch>=2.5", "pillow>=10", "requests>=2.31,<3"]
audio = ["faster-whisper>=1.0"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pillow>=10"]  # pillow: validar fotos subidas
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rappi-ia = "rappi_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rappi_ia.concepts" = ["*.toml", "*.csv"]
"rappi_ia.eval" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Patrón estándar de FastAPI: Depends/Query/File/Form como valores por defecto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
