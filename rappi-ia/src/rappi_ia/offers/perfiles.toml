# Perfiles de gusto: lo que la persona pide seguido (sus segmentos, concepts/segments.toml) arma un perfil, y cada
# perfil tiene una escalera de verticales que el agente ofrece de a un peldaño, con su «¿Por qué?» y con «Olvidar».
# Agregar un perfil es escribir datos aquí, no código. offers/profiles.py los valida al cargar.
#
# - `principal = true`: va primero entre los perfiles de la persona (solo uno; hoy, el asiático).
# - `segmentos`: ids de segments.toml que lo activan, en un nivel igual o mayor a `nivel_minimo`. Nunca sensibles.
# - `escalera`: peldaños en orden, de lo más cercano a lo más lejano. Cada uno busca en su `vertical` los productos de
#   sus `conceptos`; con `palabras`, solo los que tienen alguna en el nombre (se comparan sin tildes ni mayúsculas;
#   basta el comienzo: «tiramis» es tiramisú). `texto` es lo que dice el agente al ofrecerlo.
# - `viaje`: id de un destino de destinos.toml (el último peldaño, «Idea para RappiTravel»), o nada.
#
# Las guardias de ofertas mandan (offers/guards.py): ningún peldaño nombra alcohol, farmacia, bebé, salud ni algo
# sensible, ni las verticales Farmacia y Licores. Por eso el carrete va sin alcohol.

[[perfil]]
id = "asiatico"
nombre = "Amante de lo asiático"
emoji = "🥢"
principal = true
segmentos = ["sushi", "asiatica", "japonesa", "china"]
nivel_minimo = "medio"
viaje = "japon"

[[perfil.escalera]]
vertical = "restaurantes"
conceptos = ["sushi", "asiatica"]
texto = "Asiáticos que todavía no pruebas"

[[perfil.escalera]]
vertical = "turbo"
conceptos = ["despensa-asiatica"]
texto = "Para hacer sushi en casa, en minutos"

[[perfil.escalera]]
vertical = "conveniencia"
conceptos = ["snacks-asiaticos", "bebidas-asiaticas"]
texto = "Snacks asiáticos para el antojo"

[[perfil.escalera]]
vertical = "supermercado"
conceptos = ["despensa-asiatica", "bebidas-asiaticas"]
texto = "Tu despensa asiática"

[[perfil.escalera]]
