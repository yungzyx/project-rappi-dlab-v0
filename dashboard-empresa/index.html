<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Panel de negocio (demo) para Rappi Chile: frecuencia, abandono, demanda no satisfecha y salud del catálogo." />
    <title>Panel de negocio · Rappi Chile (propuesta)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema elegido antes de pintar, para no mostrar un destello del otro tema.
      try {
        const theme = localStorage.getItem('panel-empresa:tema')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Sin almacenamiento se sigue al sistema.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
