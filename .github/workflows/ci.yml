name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repo: ningún job publica ni escribe en GitHub.
permissions:
  contents: read

jobs:
  rappi-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-scraper

    services:
      postgres:
        image: pgvector/pgvector:pg17  # misma versión que el Postgres local (Homebrew)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rappi-scraper/pyproject.toml

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      # La tarea semanal es un script de zsh: sin zsh sus 9 tests se saltaban en silencio.
      - name: Instalar zsh
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  rappi-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-ia

    services:
      postgres:
        image: pgvector/pgvector:pg17  # trae unaccent (contrib) para la búsqueda sin tildes
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_ia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_ia_test
      RAPPI_IA_LIGHT: "1"  # sin modelos: los tests usan un embedder falso determinista

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-ia/pyproject.toml
            rappi-ia/requirements.lock.txt
            rappi-scraper/pyproject.toml

      - name: Instalar (sin extras de modelos)
        run: python -m pip install -c requirements.lock.txt -e ../rappi-scraper -e ".[api,dev]"  # mismas versiones que en el Mac

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  prototipo-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # jsdom y vitest piden Node ≥ 22.22 o ≥ 24.15
          cache: npm
          cache-dependency-path: prototipo-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
